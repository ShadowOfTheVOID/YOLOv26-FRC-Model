<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161a1f">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
<title>Match Queue</title>
<!-- Served by the Watchtower app at /queue on the FMS port (so also on the
     public address). No PIN: it only reads /ws, the state every page gets,
     and /queue/tba.json (TBA's schedule, fetched by the app with its Read
     key) for ?event=KEY or while Watchtower has no schedule.
     Teams in the pits and the queuers' line had to ask the scorekeeper what
     was next; Watchtower's own pages show only the current match. -->
<link rel="stylesheet" href="/wt/theme.css">
<style>
  /* 2026-11 redesign: a pit board. Tokens and dark mode come from theme.css. */
  body { background: var(--wall); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 1.1rem 3rem; }
  .top { display: flex; align-items: center; gap: .9rem; padding: 1.4rem 0 1.1rem; flex-wrap: wrap; }
  .top img { width: 44px; height: 44px; border-radius: 12px; background: var(--barbg); padding: 6px; }
  .top h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -.025em; }
  .top .sub { display: flex; align-items: center; gap: .45rem; color: var(--muted); font-size: .85rem; font-weight: 550; margin-top: .1rem; }
  .top .sp { flex: 1; }
  .conn { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .conn.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .team { position: relative; display: flex; align-items: center; }
  .team svg { position: absolute; left: .8rem; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .team input { width: 11rem; min-height: 46px; padding: .4rem .9rem .4rem 2.3rem; border-radius: 12px; font-size: 1.05rem;
    font-weight: 700; border: 1px solid var(--line-strong); background: var(--panel); box-shadow: var(--shadow); }
  .mine { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .3rem 1rem; padding: 1.1rem 1.25rem;
    margin-bottom: 1.2rem; border-radius: 18px; background: var(--barbg); color: #fff; box-shadow: 0 10px 30px rgba(15,18,22,.18); }
  .mine .num { grid-column: 1; grid-row: 1 / 3; font: 850 2.6rem/1 ui-monospace, Menlo, monospace; letter-spacing: -.04em; color: var(--fuel); min-width: 2ch; text-align: center; }
  .mine .lbl { grid-column: 2; grid-row: 1; font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #9aa3ae; }
  .mine .what { grid-column: 2; grid-row: 2; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
  .mine .stn { grid-column: 3; grid-row: 1 / 3; align-self: center; padding: .45rem .8rem; border-radius: 10px; font-weight: 800; font-size: .9rem; text-transform: uppercase; letter-spacing: .06em; }
  .mine .stn.red { background: var(--red); } .mine .stn.blue { background: var(--blue); }
  .mine.warn { background: var(--warn-soft); color: var(--warn); box-shadow: none; display: block; }
  .mine.plain { display: block; }
  .sec { display: flex; align-items: center; gap: .6rem; font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin: 1.4rem 0 .6rem; }
  .sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .m { display: grid; grid-template-columns: 9.5rem 1fr 1fr; gap: .55rem; align-items: stretch; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: .6rem; margin-bottom: .5rem; transition: transform .15s; }
  .m.field { border: 0; padding: .8rem; box-shadow: 0 0 0 2px var(--fuel), 0 12px 36px color-mix(in srgb, var(--fuel) 28%, transparent); }
  .m.hl { box-shadow: 0 0 0 2px var(--ink), var(--shadow); }
  .m.field.hl { box-shadow: 0 0 0 2px var(--fuel), 0 0 0 5px var(--ink); }
  .who { display: flex; flex-direction: column; justify-content: center; gap: .3rem; padding-left: .45rem; }
  .who b { font-size: 1.08rem; font-weight: 760; letter-spacing: -.015em; }
  .who .tag { align-self: flex-start; font-size: .7rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
    padding: .18rem .5rem; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
  .m.field .who .tag { background: var(--fuel); color: #1a1500; }
  .m.field .who .tag::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: .35rem; border-radius: 50%;
    background: #d4141b; vertical-align: 1px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .m.deck .who .tag { background: color-mix(in srgb, var(--fuel) 22%, transparent); color: color-mix(in srgb, var(--fuel) 30%, var(--ink)); }
  .m.soon .who .tag { background: var(--ok-soft); color: var(--ok); }
  .al { border-radius: 10px; padding: .5rem .55rem; display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; }
  .al.red { background: var(--red-soft); } .al.blue { background: var(--blue-soft); }
  .al .an { font-size: .66rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; width: 100%; }
  .al.red .an { color: var(--red); } .al.blue .an { color: var(--blue); }
  .t { flex: 1; text-align: center; font: 780 1.15rem/1.25 ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums;
    padding: .15rem .3rem; border-radius: 7px; }
  .al.red .t { color: var(--red); } .al.blue .t { color: var(--blue); }
  .t.me { background: var(--ink); color: var(--on-ink) !important; }
  .t sup { font-size: .55em; opacity: .8; }
  .empty { text-align: center; color: var(--muted); padding: 3rem 1rem; background: var(--panel); border-radius: 16px; border: 1px dashed var(--line-strong); }
  .more { color: var(--muted); text-align: center; font-size: .9rem; margin-top: .8rem; }
  @media (max-width: 620px) {
    .top { padding-top: 1rem; } .team { width: 100%; } .team input { width: 100%; }
    .m { grid-template-columns: 1fr 1fr; gap: .4rem; padding: .5rem; }
    .who { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; padding: .1rem .3rem .2rem; }
    .al { padding: .35rem .3rem; gap: .1rem; flex-wrap: nowrap; }
    .al .an { display: none; }
    .t { font-size: 1rem; padding: .1rem .15rem; }
    .mine { grid-template-columns: auto 1fr; } .mine .stn { grid-row: 3; grid-column: 1 / -1; text-align: center; }
  }
  /* A pit TV across the room: ?tv=1 */
  body.tv .wrap { max-width: 1500px; }
  body.tv .top h1 { font-size: 2.2rem; }
  body.tv .m { grid-template-columns: 14rem 1fr 1fr; padding: 1rem; }
  body.tv .t { font-size: 2.1rem; }
  body.tv .who b { font-size: 1.8rem; }
  body.tv .team { display: none; }
</style>
</head><body>
<main class="wrap">
  <div class="top"><img src="/static/icon.svg" alt=""><div><h1 id="ev">Match queue</h1>
    <div class="sub"><span class="conn" title="Live"></span><span id="sub">Connecting…</span></div></div><span class="sp"></span>
    <label class="team" title="Your team number: highlights your matches and says when you are up">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="team" inputmode="numeric" placeholder="Your team #" autocomplete="off" aria-label="Your team number"></label></div>
  <div class="mine" id="mine" hidden></div>
  <div id="list"></div>
</main>
<script src="/static/common.js"></script>
<script>
const P = new URLSearchParams(location.search);
const SHOW = Math.max(1, parseInt(P.get("n") || "10", 10) || 10);
if (P.get("tv") === "1") document.body.classList.add("tv");
const esc = FMS.esc, box = document.getElementById("team");
// ?team= wins (a link or a QR made for one team), else what this phone typed last.
let team = (P.get("team") || (() => { try { return localStorage.getItem("queue_team") || ""; } catch (e) { return ""; } })()).replace(/\D/g, "");
box.value = team;
box.oninput = () => {
  team = box.value.replace(/\D/g, "");
  try { localStorage.setItem("queue_team", team); } catch (e) {}
  render();
};

// Where the schedule comes from: ?event=KEY is always TBA (any event, not
// just this one). Otherwise Watchtower's own schedule, and TBA's for the
// event key on The Blue Alliance tab while Watchtower has none entered.
const FORCED = (P.get("event") || "").trim().toLowerCase();
let tba = null, tbaTimer = null;
const useTba = () => !!FORCED || !!(FMS.state && !(FMS.state.matches || []).length && FMS.state.event.tba_event_key);
async function pullTba() {
  try {
    const r = await fetch("/queue/tba.json" + (FORCED ? "?event=" + encodeURIComponent(FORCED) : ""), { cache: "no-store" });
    const j = await r.json().catch(() => ({}));
    tba = r.ok ? j : { ...(tba || {}), error: j.detail || r.statusText };
  } catch (e) { tba = { ...(tba || {}), error: "Could not reach Watchtower." }; }
  render();
}
function syncTba() {
  if (useTba() && !tbaTimer) { pullTba(); tbaTimer = setInterval(pullTba, 30000); }
  if (!useTba() && tbaTimer) { clearInterval(tbaTimer); tbaTimer = null; tba = null; }
}

function title(m) {
  const sm = m.match_number > 1 ? `-${m.match_number}` : "";
  if (m.comp_level === "qm") return `Qual ${m.match_number}`;
  if (m.comp_level === "f") return `Final ${m.match_number}`;
  if (m.comp_level === "qf") return `Quarterfinal ${m.set_number}${sm}`;
  if (m.comp_level === "ef") return `Eighthfinal ${m.set_number}${sm}`;
  return `Playoff ${m.set_number}${sm}`;
}
const has = (m, t) => !!t && [...(m.red || []), ...(m.blue || [])].some((x) => String(x) === t);
const station = (m, t) => {
  for (const a of ["red", "blue"]) { const i = (m[a] || []).findIndex((x) => String(x) === t); if (i >= 0) return `${a} ${i + 1}`; }
  return "";
};
// Watchtower plans in HH:MM of the event day; TBA gives epoch seconds.
const planned = (m) => m.scheduled ||
  (m.time ? new Date(m.time * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "");

// What is queued: every match not played yet, in schedule order. From
// Watchtower, the one the scorekeeper has selected comes first (they can run
// them out of order) and the running one is on the field; TBA knows neither.
function view() {
  const s = FMS.state;
  if (useTba()) {
    const ms = (tba && tba.matches) || [];
    const ago = ms.length && tba.age != null ? (tba.age < 5 ? "just now" : `${tba.age} s ago`) : "";
    return { name: (tba && tba.name) || FORCED || "Match queue", field: null, ms,
             q: ms.filter((m) => m.status === "scheduled"),
             src: `Schedule from The Blue Alliance${tba && tba.event ? " (" + tba.event + ")" : ""}${ago ? ", updated " + ago : ""}`,
             error: tba ? tba.error : "", loading: !tba };
  }
  const ms = (s && s.matches) || [];
  const field = ms.find((m) => m.status === "running") || null;
  let q = ms.filter((m) => m.status === "scheduled");
  const cur = s && s.current;
  if (cur && cur.status === "scheduled") q = [q.find((m) => m.key === cur.key), ...q.filter((m) => m.key !== cur.key)].filter(Boolean);
  return { name: (s && s.event.name) || "Match queue", field, q, ms, src: "", error: "", loading: !s };
}

function alliance(m, a) {
  const sur = new Set((m.surrogates || []).map(String));
  const n = m[a + "_alliance"];
  return `<div class="al ${a}"><span class="an">${a === "red" ? "Red" : "Blue"}${n ? " · Alliance " + esc(n) : ""}</span>` +
    (m[a] || []).map((t) => `<span class="t${String(t) === team ? " me" : ""}">${esc(t)}${sur.has(String(t)) ? "<sup>S</sup>" : ""}</span>`).join("") + "</div>";
}
function row(m, cls, tag) {
  return `<div class="m ${cls}${has(m, team) ? " hl" : ""}"><div class="who"><b>${esc(title(m))}</b>` +
    `<span class="tag">${esc(tag)}</span></div>${alliance(m, "red")}${alliance(m, "blue")}</div>`;
}

function render() {
  syncTba();
  const v = view(), { field, q, ms } = v;
  document.getElementById("ev").textContent = v.name;
  const played = ms.filter((m) => m.status === "committed" || m.status === "review").length;
  document.getElementById("sub").textContent = v.loading ? "Connecting…" :
    [ms.length ? `${played} played · ${q.length} to go` : "", v.src].filter(Boolean).join(" · ") || "Match queue";
  let h = v.error ? `<div class="mine warn">${esc(v.error)}</div>` : "";
  if (field) h += `<div class="sec">On the field</div>` + row(field, "field", "Playing now");
  if (q.length) {
    h += `<div class="sec">Queue</div>`;
    q.slice(0, SHOW).forEach((m, i) => {
      const at = planned(m);
      const tag = i === 0 ? (field ? "On deck" : "Up next") : i <= 2 ? "Queue now" : (at ? `Planned ${at}` : `#${i + 1} in line`);
      h += row(m, i === 0 ? "deck" : i <= 2 ? "soon" : "", tag);
    });
    if (q.length > SHOW) h += `<div class="more">and ${q.length - SHOW} more</div>`;
  } else if (!field && !v.loading && !(v.error && !ms.length)) {
    h += `<div class="empty">${ms.length ? "Every scheduled match has been played." : "No matches scheduled yet."}</div>`;
  }
  document.getElementById("list").innerHTML = h;

  const mine = document.getElementById("mine");
  if (!team || v.loading) { mine.hidden = true; return; }
  mine.hidden = false;
  const i = q.findIndex((m) => has(m, team));
  mine.className = "mine";
  const stn = (m) => { const st = station(m, team); return `<span class="stn ${st.split(" ")[0]}">${esc(st)}</span>`; };
  if (field && has(field, team)) {
    mine.innerHTML = `<span class="num">●</span><span class="lbl">Team ${esc(team)}</span><span class="what">On the field now</span>${stn(field)}`;
  } else if (i < 0) {
    mine.className = "mine plain"; mine.innerHTML = `<b>${esc(team)}</b> has no more matches scheduled.`;
  } else {
    const m = q[i], ahead = i + (field ? 1 : 0), at = planned(m);
    mine.innerHTML = `<span class="num">${ahead || "UP"}</span><span class="lbl">Team ${esc(team)} · ${ahead ? (ahead > 1 ? "matches before yours" : "match before yours") : "you're next"}</span>` +
      `<span class="what">${esc(title(m))}${at ? ` · planned ${esc(at)}` : ""}</span>${stn(m)}`;
  }
}
FMS.on(render);
FMS.connect();
if (FORCED) render();
</script>
</body></html>
