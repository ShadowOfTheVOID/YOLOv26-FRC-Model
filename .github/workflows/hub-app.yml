name: hub-app

# Builds the Hub Counter app -- the hub fuel counter's web page as a
# double-click program (apps/hubcounter/) -- on each OS, since each can only
# be built on its own. The scraper is not in it. PyTorch, Ultralytics and the
# fuel model (fuel_relabel.pt from the release in .github/models-release) are,
# so every build can run the colour+model blend; the smoke test runs the
# model once inside each build.
#
#   macOS (Apple silicon)  HubCounter-mac.dmg            drag Hub Counter.app to Applications
#   Windows                HubCounter-Setup-windows.exe  installer (Start menu, uninstaller)
#   Linux x64              HubCounter-linux-x64.tar.gz   Hub Counter/Hub Counter
#   Linux arm64 (Pi 4/5)   HubCounter-linux-arm64.tar.gz Hub Counter/Hub Counter
#
# Each job also builds the Watchtower app (apps/watchtower/, Watchtower-*.zip /
# .tar.gz): the same hub counter plus the Watchtower FMS (arnan-bajaj/
# watchtower-fms at the tag in .github/watchtower-release), set up and
# started together on a double-click.
#
#   pull request touching the app or the hub code: build + smoke test each,
#     kept as workflow artifacts (Actions tab -> the run -> Artifacts)
#   "Run workflow" button: the same, on demand
#   v* tag: the same, then each is attached to that release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/hubcounter/**"
      - "apps/watchtower/**"
      - ".github/watchtower-release"
      - "tbavid/hub*"
      - "tbavid/fmslink.py"
      - "tbavid/count.py"
      - "tbavid/trackvis.py"
      - ".github/workflows/hub-app.yml"
      - ".github/models-release"
  workflow_dispatch:

permissions:
  contents: write            # to attach the builds to a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: HubCounter-mac.dmg
            program: dist/Hub Counter.app/Contents/MacOS/Hub Counter
            wasset: Watchtower-mac.dmg
            wprogram: dist/Watchtower.app/Contents/MacOS/Watchtower
          - os: windows-latest
            asset: HubCounter-Setup-windows.exe
            program: dist/Hub Counter/Hub Counter.exe
            wasset: Watchtower-Setup-windows.exe
            wprogram: dist/Watchtower/Watchtower.exe
          # 22.04's older glibc so the Linux builds also run on newer
          # Ubuntu / Debian and on Raspberry Pi OS (bookworm).
          - os: ubuntu-22.04
            asset: HubCounter-linux-x64.tar.gz
            program: dist/Hub Counter/Hub Counter
            wasset: Watchtower-linux-x64.tar.gz
            wprogram: dist/Watchtower/Watchtower
          - os: ubuntu-22.04-arm
            asset: HubCounter-linux-arm64.tar.gz
            program: dist/Hub Counter/Hub Counter
            wasset: Watchtower-linux-arm64.tar.gz
            wprogram: dist/Watchtower/Watchtower
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyPI's Linux torch carries CUDA on both x64 and arm64: the arm64 build
      # came out at 3049 MB, over GitHub's 2 GB asset limit. PyTorch's CPU
      # index has the same torch without it. Mac (MPS) and Windows wheels on
      # PyPI are CPU/MPS already (Windows 288 MB, Linux x64 CPU 398 MB).
      # Ultralytics --no-deps, or it pulls opencv-python beside the headless
      # one (116 MB twice) and SciPy, which counting never imports.
      - name: Install the build tools, OpenCV, PyTorch and Ultralytics
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch torchvision
          fi
          pip install pyinstaller opencv-python-headless numpy yt-dlp
          pip install --no-deps ultralytics ultralytics-thop
          pip install matplotlib pillow pyyaml requests psutil polars
          pip install fastapi uvicorn websockets      # Watchtower's server
          pip install pywebview qrcode                # Watchtower's own windows, phone QR code

      - name: The built-in fuel model, checked against CHANGELOG's checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          gh release download "$(cat .github/models-release)" -p fuel_relabel.pt -D models --clobber
          python - <<'PY'
          import hashlib, re
          want = re.search(r"^([0-9a-f]{64})  fuel_relabel\.pt$", open("CHANGELOG.md").read(), re.M).group(1)
          got = hashlib.sha256(open("models/fuel_relabel.pt", "rb").read()).hexdigest()
          assert got == want, f"fuel_relabel.pt is {got}, CHANGELOG says {want}"
          print("fuel_relabel.pt", got)
          PY

      - name: Build
        env:
          HUBCOUNTER_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
          HUBCOUNTER_REQUIRE_MODEL: "1"
        run: pyinstaller --noconfirm apps/hubcounter/HubCounter.spec

      - name: Smoke test (page, board, data folder, Quit, the model runs)
        env:
          HUBCOUNTER_REQUIRE_MODEL: "1"
        run: python apps/hubcounter/smoke_test.py "${{ matrix.program }}"

      - name: Get Watchtower
        run: git clone --depth 1 --branch "$(cat .github/watchtower-release)" https://github.com/arnan-bajaj/watchtower-fms.git watchtower-src

      - name: Build Watchtower
        env:
          HUBAPP: watchtower
          HUBCOUNTER_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
          HUBCOUNTER_REQUIRE_MODEL: "1"
        run: pyinstaller --noconfirm --workpath build/watchtower apps/hubcounter/HubCounter.spec

      - name: Smoke test Watchtower (setup, FMS, counter preset to it, vision key, Quit)
        run: python apps/watchtower/smoke_test.py "${{ matrix.wprogram }}"

      # Linux builds fall back to the browser (no WebKit GTK bundled), so the
      # window test runs where the app opens its own windows.
      - name: Watchtower's app windows (Home, Scorekeeper, Hub cameras, Field display)
        if: runner.os != 'Linux'
        run: python apps/watchtower/smoke_test.py --window "${{ matrix.wprogram }}"

      # Mac: a .dmg holding the app and an Applications link to drag it onto.
      # Windows: an Inno Setup installer (apps/installer/windows.iss), per
      # user, with Start-menu shortcut and uninstaller. Linux: tar.gz.
      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: |
          [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress

      - name: Package
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
        run: |
          pack() {   # folder name in dist/, asset file
            case "$2" in
              *.dmg)
                stage=$(mktemp -d)
                cp -R "dist/$1.app" "$stage/"
                ln -s /Applications "$stage/Applications"
                hdiutil create -volname "$1" -srcfolder "$stage" -ov -format UDZO "$2" ;;
              *Setup-windows.exe)
                # Absolute paths: Inno resolves relative ones from the .iss's folder.
                # Inno's own error, as an annotation: the raw log is not on the PR.
                if ! "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "-DAppName=$1" "-DAppExe=$1.exe" \
                    "-DSrcDir=$(cygpath -w "$PWD/dist/$1")" "-DOutFile=${2%.exe}" \
                    "-DAppVersion=${APP_VERSION#v}" "-O$(cygpath -w "$PWD")" apps/installer/windows.iss \
                    > iscc.log 2>&1; then
                  echo "::error title=Inno Setup ($1)::$(grep -iE 'error|line [0-9]+' iscc.log | tail -5 | tr '\n' ' ')"
                  tail -30 iscc.log; return 1
                fi
                grep -iE "warning" iscc.log | head -5 || true ;;
              *.tar.gz)  tar -czf "$2" -C dist "$1" ;;
            esac
            # A release asset over 2 GB is refused at upload, after the
            # release is already public; stop here instead.
            python -c "import os,sys; n=os.path.getsize(sys.argv[1]); print(sys.argv[1], n>>20,'MB'); sys.exit(n > 1900*2**20)" "$2"
          }
          pack "Hub Counter" "${{ matrix.asset }}"
          pack "Watchtower" "${{ matrix.wasset }}"

      # What people download is what gets checked: the app run out of the
      # mounted .dmg, and the apps the installer put in place.
      - name: Check the downloads (mounted .dmg / installed apps)
        if: runner.os != 'Linux'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            mnt=$(mktemp -d)
            hdiutil attach "${{ matrix.wasset }}" -nobrowse -readonly -mountpoint "$mnt"
            ls "$mnt"
            [ -L "$mnt/Applications" ] || { echo "::error::no Applications link in the dmg"; exit 1; }
            python apps/watchtower/smoke_test.py "$mnt/Watchtower.app/Contents/MacOS/Watchtower"
            hdiutil detach "$mnt"
          else
            for app in "Watchtower" "Hub Counter"; do
              setup="${{ matrix.wasset }}"; [ "$app" = "Hub Counter" ] && setup="${{ matrix.asset }}"
              dir="$RUNNER_TEMP/installed/$app"
              ./"$setup" //VERYSILENT //SUPPRESSMSGBOXES //CURRENTUSER //NORESTART "//DIR=$(cygpath -w "$dir")"
              for i in $(seq 1 60); do [ -f "$dir/$app.exe" ] && break; sleep 2; done
              ls "$dir" | head
            done
            python apps/watchtower/smoke_test.py "$RUNNER_TEMP/installed/Watchtower/Watchtower.exe"
            python apps/hubcounter/smoke_test.py "$RUNNER_TEMP/installed/Hub Counter/Hub Counter.exe"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.wasset }}
          path: ${{ matrix.wasset }}

      # release.yml creates the release from the same tag; wait for it.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            gh release view "${{ github.ref_name }}" >/dev/null 2>&1 && break
            sleep 15
          done
          gh release upload "${{ github.ref_name }}" "${{ matrix.asset }}" "${{ matrix.wasset }}" --clobber
